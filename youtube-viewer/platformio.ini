; Visor de estadisticas de YouTube para ESP32-CAM + TFT SPI 4.0" 480x320 (ST7796S)

[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
board_build.partitions = huge_app.csv

monitor_speed = 115200
; La placa ESP32-CAM-MB usa RTS/DTR para reset/boot; sin esto el monitor la deja en reset.
monitor_rts = 0
monitor_dtr = 0

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@^1.1.0
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    ; --- Configuracion de TFT_eSPI (sustituye a User_Setup.h) ---
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D USE_HSPI_PORT=1
    -D TFT_MISO=-1
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    ; Si los colores salen cambiados (rojo <-> azul) descomenta:
    ; -D TFT_RGB_ORDER=TFT_BGR
    ; Si la imagen sale en negativo descomenta:
    ; -D TFT_INVERSION_ON=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_GFXFF=1
    -D SPI_FREQUENCY=40000000
